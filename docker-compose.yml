services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cms_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity Service
  identityservice:
    build:
      context: .
      dockerfile: docker/IdentityService.Dockerfile
    container_name: cms_identityservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=IdentityServiceDb;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForProduction
      - JwtSettings__Issuer=CMS-ApiGateway
      - JwtSettings__Audience=CMS-Services
      - JwtSettings__ExpiryMinutes=60
    ports:
      - "5128:5128"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cms_network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5128/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  apigateway:
    build:
      context: .
      dockerfile: docker/ApiGateway.Dockerfile
    container_name: cms_apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ServiceUrls__IdentityService=http://identityservice:5128
      - ServiceUrls__UserService=http://userservice:5001
      - ServiceUrls__ContentService=http://contentservice:5002
      - JwtSettings__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForProduction
      - JwtSettings__Issuer=CMS-ApiGateway
      - JwtSettings__Audience=CMS-Services
      - JwtSettings__ExpiryMinutes=60
    ports:
      - "5000:5000"
    depends_on:
      - identityservice
      - userservice
      - contentservice
    networks:
      - cms_network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  userservice:
    build:
      context: .
      dockerfile: docker/UserService.Dockerfile
    container_name: cms_userservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=UserServiceDb;Username=postgres;Password=postgres
      - JwtSettings__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForProduction
      - JwtSettings__Issuer=CMS-ApiGateway
      - JwtSettings__Audience=CMS-Services
      - JwtSettings__ExpiryMinutes=60
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cms_network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Content Service
  contentservice:
    build:
      context: .
      dockerfile: docker/ContentService.Dockerfile
    container_name: cms_contentservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ContentServiceDb;Username=postgres;Password=postgres
      - Services__UserService__BaseUrl=http://userservice:5001
      - JwtSettings__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForProduction
      - JwtSettings__Issuer=CMS-ApiGateway
      - JwtSettings__Audience=CMS-Services
      - JwtSettings__ExpiryMinutes=60
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      userservice:
        condition: service_healthy
    networks:
      - cms_network
    restart: unless-stopped
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cms_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cms.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - cms_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  cms_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  app_logs:
